<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <meta http-equiv="refresh" content="10">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cotação do Dólar</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="container">

        <h1>Cotação do Dólar</h1>
        <p class="subtitulo">Dólar Americano (USD/BRL)</p>

        <section class="cotacao">

            <div class="card">
                <h2>Valor Atual</h2>
                <p id="valor-atual">Carregando...</p>
            </div>

            <div class="card">
                <h2>Maior do Dia</h2>
                <p id="maior-dia">Carregando...</p>
            </div>

            <div class="card">
                <h2>Menor do Dia</h2>
                <p id="menor-dia">Carregando...</p>
            </div>

        </section>

        <p class="atualizacao">
            A página é atualizada automaticamente a cada 10 segundos.
        </p>

    </main>

    <script src="script.js"></script>

</body>
</html>
